<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 48" width="830" height="48" role="img" aria-label="Projects">
<title>Projects</title>
<defs><style>
.sg{font-family:'HA Grotesk';font-weight:500}
.mono{font-family:'HA Mono';font-weight:400}
.monoM{font-family:'HA Mono';font-weight:500}
@font-face{font-family:'HA Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'HA Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}

.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .5s ease-out both}
.draw{animation:draw 2.8s linear .4s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<text x="0" y="33" font-size="24" text-anchor="start" letter-spacing="-0.4" xml:space="preserve"><tspan class="sg" fill="#e5603f">Projects</tspan></text><line x1="109" x2="620" y1="26" y2="26" stroke="#7d8590" stroke-opacity=".45"/><text x="828" y="30" font-size="12" text-anchor="end" xml:space="preserve"><tspan class="mono" fill="#7d8590">each card opens the project</tspan></text>
</svg>
